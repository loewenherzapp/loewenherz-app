<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7ead8" id="theme-color-meta">
<meta name="description" content="Die App zum Buch von Dr. med. Patrick Eberle, dem AngstDoc: Morgenkompass, SMALL-Reminder und Abendreflexion. Kostenlos für iPhone und Android.">

<title>Löwenherz – Die App zum Buch | iPhone und Android</title>

<!-- Für neue Besucher im Browser ist diese Seite die Landing (js/screens/landing.js).
     Vorschau beim Teilen des Links: -->
<link rel="canonical" href="https://app.angstdoc.de/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Löwenherz">
<meta property="og:locale" content="de_DE">
<meta property="og:url" content="https://app.angstdoc.de/">
<meta property="og:title" content="Löwenherz – Die App zum Buch">
<meta property="og:description" content="Morgenkompass, SMALL-Reminder und Abendreflexion: die Begleit-App zum Buch von Dr. med. Patrick Eberle. Kostenlos im App Store und bei Google Play.">
<meta property="og:image" content="https://app.angstdoc.de/landing/og-loewenherz.jpg">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="500">
<meta name="twitter:card" content="summary_large_image">
<!-- Safari auf dem iPhone zeigt damit oben den Hinweis auf die App
     („Laden“ bzw. „Öffnen“, wenn sie schon installiert ist). -->
<meta name="apple-itunes-app" content="app-id=6806331837">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <div id="landing-container" class="hidden"></div>
    <div id="onboarding-container" class="hidden"></div>
    <div id="email-gate-container" class="hidden"></div>
    <div id="settings-container" class="hidden"></div>
    <div id="app-shell" class="hidden">
      <header class="app-header">
        <div class="header-left">
          <span class="header-title">Löwenherz</span>
          <button class="header-info-btn hidden" id="header-info-btn" aria-label="App-Info">ⓘ</button>
        </div>
        <div class="header-actions">
          <button class="header-crisis" id="crisis-btn" aria-label="Krisenhilfe">♡</button>
          <button class="header-settings" id="settings-btn" aria-label="Einstellungen">⚙</button>
        </div>
      </header>
      <main class="main-content" id="main-content"></main>
      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-tab active" data-tab="today">
          <span id="tab-label-today">Heute</span>
        </button>
        <button class="nav-tab" data-tab="reflection">
          <span id="tab-label-reflection">Reflexion</span>
        </button>
        <button class="nav-tab" data-tab="history">
          <span id="tab-label-history">Verlauf</span>
        </button>
      </nav>
    </div>
    <div class="sheet-overlay" id="sheet-overlay"></div>
    <div class="sheet-container" id="sheet-container">
      <div class="sheet-grip"></div>
      <div class="sheet-title"></div>
      <div class="sheet-options"></div>
    </div>
    <div id="crisis-modal"></div>
  </div>
  <script type="module">
    // Web-only-Bootstrap. In der nativen Capacitor-App (WKWebView) gibt es
    // keinen Service Worker — Assets sind gebündelt, Analytics entfällt.
    import { isNative } from './js/platform.js';

    if (!isNative()) {
      // App-Cache-SW registrieren (kein OneSignal-Import → keine CDN-Anfrage vor Opt-in).
      // Sobald der User Push aktiviert, ersetzt OneSignal-SDK den SW durch OneSignalSDKWorker.js.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.getRegistration().then(function(reg) {
            // Auch installing/waiting prüfen: Während OneSignals Worker noch
            // installiert (CDN-Import, Cache füllen), ist nur sw.js aktiv.
            // sw.js jetzt erneut zu registrieren würde den OneSignal-Worker
            // verdrängen — das Push-Abo hinge dann an sw.js ohne push-Handler.
            var w = reg && (reg.installing || reg.waiting || reg.active);
            if (!reg || (w && w.scriptURL.indexOf('OneSignalSDKWorker') === -1)) {
              navigator.serviceWorker.register('sw.js', { scope: '/' }).catch(function() {});
            }
          });
        });
      }

      // Vercel Analytics same-origin laden — kein Dritt-CDN, keine IP an jsdelivr
      var insights = document.createElement('script');
      insights.defer = true;
      insights.src = '/_vercel/insights/script.js';
      document.head.appendChild(insights);
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
