apply plugin: 'com.android.application'

android {
    namespace = "de.angstdoc.loewenherz"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.angstdoc.loewenherz"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play-Historie: 1–4 waren die TWA-Bauten (Bubblewrap), 5 der erste
        // Capacitor-Bau (hochgeladen, nie eingereicht), 6 = 5 + neuer
        // Newsletter-Einwilligungstext, 7 = Tester-Feedback (Etikett folgt
        // dem Satz, Stimmungskurve im Verlauf), 8 = neues Logo (Icon, Splash
        // Creme) und erster Produktions-Release, 9 = R8 (Code verkleinert und
        // verschleiert, Mapping-Datei). versionName folgt der iOS-Zählung.
        versionCode 9
        versionName "1.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Upload-Key (Play App Signing signiert um). Pfad und Passwörter kommen aus
    // der Umgebung — gesetzt von scripts/release-android.mjs, nie aus dem Repo.
    // Ohne LH_KEYSTORE_FILE bleibt der Release-Build unsigniert (Debug/cap sync
    // laufen unverändert).
    signingConfigs {
        release {
            if (System.getenv("LH_KEYSTORE_FILE")) {
                storeFile file(System.getenv("LH_KEYSTORE_FILE"))
                storePassword System.getenv("LH_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LH_KEY_ALIAS")
                keyPassword System.getenv("LH_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // R8 seit versionCode 9: verkleinert, optimiert und verschleiert den
            // Java/Kotlin-Code. Play verlangt das bis Feb. 2027 („DEX-Codeoptimierung
            // unter dem Grenzwert – Verschleierung 1 %"). Keep-Regeln für Capacitor,
            // OneSignal und WorkManager bringen die Bibliotheken selbst mit, die
            // eigenen stehen in proguard-rules.pro. Die Mapping-Datei legt
            // scripts/release-android.mjs neben AAB und APK ab.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("LH_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
